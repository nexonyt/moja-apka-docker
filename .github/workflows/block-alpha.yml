name: Block Alpha Content
on:
  pull_request:
    branches: [ "master" ] # Blokada działa tylko przy próbie wejścia do Mastera

jobs:
  check-alpha:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for 'alpha' in Commit Messages
        run: |
          # Sprawdza commity w PR pod kątem słowa "alpha"
          if git log origin/${{ github.base_ref }}..HEAD --pretty=format:"%s" | grep -i "alpha"; then
            echo "❌ BŁĄD: Znaleziono słowo 'alpha' w nazwie commita!"
            exit 1
          else
            echo "✅ Commity czyste."
          fi

      - name: Check for 'alpha' in Branch Name
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          if [[ "$BRANCH_NAME" == *"alpha"* ]]; then
             echo "❌ BŁĄD: Nazwa brancha '$BRANCH_NAME' zawiera słowo 'alpha'!"
             exit 1
          else
             echo "✅ Nazwa brancha poprawna."
          fi